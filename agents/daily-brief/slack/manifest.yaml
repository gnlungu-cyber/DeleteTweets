# Slack app manifest - paste into https://api.slack.com/apps -> Create New App -> From a manifest.
# Not an ant resource: ant apply does not read this file.
display_information:
  name: Daily brief
  description: Posts one short brief each weekday morning.
features:
  bot_user:
    display_name: Daily brief
    always_online: false
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
oauth_config:
  scopes:
    bot:
      - channels:history   # read the public channels the bot is invited to (sources + duplicate check)
      - chat:write         # post the brief
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
